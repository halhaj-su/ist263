<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a> |
        <a href="skills.html">Skills</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Contact</h1>

    <main>

        <!-- First row: Address and Links -->
        <div class="contact-row">

            <div class="contact-box">
                <h2>Address</h2>

                <p>
                    Hisham Alhaj<br>
                    Syracuse University<br>
                    343 Hinds Hall<br>
                    Syracuse, NY 13244
                </p>
            </div>

            <div class="contact-box">
                <h2>Contact Information</h2>

                <p>
                    <a href="mailto:halhaj@syr.edu">
                        halhaj@syr.edu
                    </a>
                </p>

                <a href="https://www.linkedin.com/in/hisham-alhaj2327/"
                   target="_blank" rel="noopener noreferrer">
                    <img src="../images/logo-sized.png"
                         alt="LinkedIn logo">
                    My LinkedIn Profile
                </a>
            </div>

        </div>

        <!-- Second row: Form and Map -->
        <div class="contact-row">

            <div class="contact-box">
                <h2>Contact Me</h2>

                <form action="https://formspree.io/f/meaoeagd"
                      method="post">

                    <label for="name">Your Name:</label>
                    <input type="text" id="name"
                           name="name" required>

                    <label for="reason">
                        Reason for Contact:
                    </label>

                    <select id="reason" name="reason">
                        <option value="school">School</option>
                        <option value="work">Work</option>
                        <option value="networking">Networking</option>
                        <option value="other">Other</option>
                    </select>

                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message"
                              rows="5" required></textarea>

                    <input type="submit" value="Send Message">

                </form>
            </div>

            <div class="contact-box">
                <h2>Location</h2>

                <iframe
                    title="Syracuse University Map"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46658.11510564291!2d-76.1573501675348!3d43.03865003731226!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d9f39fba2ccc55%3A0x5e6089065251084d!2sSyracuse%20University!5e0!3m2!1sen!2sus!4v1789171467261!5m2!1sen!2sus"
                    width="600"
                    height="450"
                    style="border:0;"
                    allowfullscreen
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

        </div>

    </main>

</body>
</html>
